{% extends "base.html" %}
{% block title %}Logs — Futures{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-title">
    Logs <span id="logCount"></span>
  </div>
  <div class="month-nav">
    <button class="cal-nav" id="prevMonth" title="Previous month">&#8249;</button>
    <div class="month-label" id="monthLabel">—</div>
    <button class="cal-nav" id="nextMonth" title="Next month">&#8250;</button>
  </div>
</div>

<div class="logs-grid" id="logsGrid">
  <!-- cards injected by JS -->
</div>

<div class="logs-hint">
  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="7"/>
    <line x1="8" y1="7" x2="8" y2="11"/>
    <circle cx="8" cy="5" r=".5" fill="currentColor" stroke="none"/>
  </svg>
</div>

<script>
let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let logsData     = {};
let tradesData   = {};
let saveTimers   = {};

const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const DAYS   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function fmtPnL(v){
  if(v === null || v === undefined) return null;
  const abs = Math.abs(v).toFixed(2);
  return (v >= 0 ? '+$' : '-$') + Number(abs).toLocaleString('en-US', {minimumFractionDigits:2});
}
function escHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function fetchLogs(year, month){
  try {
    const r = await fetch(`/api/logs?year=${year}&month=${pad(month+1)}`);
    if(!r.ok) return {};
    const arr = await r.json();
    const map = {};
    arr.forEach(l => { map[l.date] = l; });
    return map;
  } catch(e){ return {}; }
}

async function fetchTrades(year, month){
  try {
    const r = await fetch(`/api/trades/summary?year=${year}&month=${pad(month+1)}`);
    if(!r.ok) return {};
    const arr = await r.json();
    const map = {};
    arr.forEach(t => { map[t.date] = t; });
    return map;
  } catch(e){ return {}; }
}

async function saveLog(date, text){
  const existing = logsData[date];
  if(existing && existing.id){
    await fetch(`/api/logs/${existing.id}`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ logs: text })
    });
  } else {
    const r = await fetch('/api/logs', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ date, logs: text })
    });
    if(r.ok){
      const created = await r.json();
      logsData[date] = created;
    }
  }
  if(logsData[date]) logsData[date].logs = text;
  else logsData[date] = { date, logs: text };
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

function renderCards(){
  const grid = document.getElementById('logsGrid');
  grid.innerHTML = '';

  const total = daysInMonth(currentYear, currentMonth);
  const today = new Date(); today.setHours(0,0,0,0);
  const cards = [];

  for(let d = 1; d <= total; d++){
    const dateStr = fmtDate(currentYear, currentMonth, d);
    const dow     = new Date(currentYear, currentMonth, d).getDay();
    if(dow === 0 || dow === 6) continue;
    const dt = new Date(currentYear, currentMonth, d);
    if(dt > today && !logsData[dateStr]) continue;
    cards.push({ dateStr, d, dow });
  }

  if(!cards.length){
    grid.innerHTML = `
      <div class="logs-empty">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        No trading days yet this month.
      </div>`;
    document.getElementById('logCount').textContent = '';
    return;
  }

  const withLogs = cards.filter(c => logsData[c.dateStr]?.logs?.trim()).length;
  document.getElementById('logCount').textContent =
    withLogs ? `· ${withLogs} entr${withLogs===1?'y':'ies'}` : '';

  const todayStr = fmtDate(today.getFullYear(), today.getMonth(), today.getDate());

  cards.forEach(({ dateStr, d, dow }) => {
    const logEntry = logsData[dateStr];
    const trade    = tradesData[dateStr];
    const text     = logEntry?.logs || '';
    const isToday  = dateStr === todayStr;

    const card = document.createElement('div');
    card.className = 'log-card' + (isToday ? ' log-card--today' : '');
    card.dataset.date = dateStr;

    const monthShort = MONTHS[currentMonth].slice(0,3).toUpperCase();
    const dayName    = DAYS[dow];

    let pnlHtml = '';
    if(trade){
      const cls = trade.pnl > 0 ? 'pnl-positive' : trade.pnl < 0 ? 'pnl-negative' : '';
      pnlHtml = `<span class="log-card-pnl ${cls}">${fmtPnL(trade.pnl)}</span>`;
    }

    const tradesHtml = trade
      ? `<span class="log-card-trades">
           <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1,11 5,7 9,9 15,3"/></svg>
           ${trade.trades} trade${trade.trades===1?'':'s'}
         </span>`
      : `<span class="log-card-trades" style="opacity:.35">No trades</span>`;

    card.innerHTML = `
      <div class="log-card-header">
        <div>
          <div class="log-card-date">${monthShort} ${pad(d)}</div>
          <div class="log-card-weekday">${dayName}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${isToday ? '<span class="log-today-badge">Today</span>' : ''}
          <span class="log-saving-dot" id="dot-${dateStr}"></span>
        </div>
      </div>
      <div class="log-card-body">
        <div class="log-view ${text ? '' : 'log-view--empty'}" id="view-${dateStr}">${
          text ? escHtml(text) : 'Click to write your thoughts for this day\u2026'
        }</div>
        <textarea class="log-textarea" id="edit-${dateStr}" placeholder="Write your thoughts for this day\u2026">${escHtml(text)}</textarea>
      </div>
      <div class="log-card-footer">
        ${tradesHtml}
        <div style="display:flex;align-items:center;gap:8px;">
          ${pnlHtml}
          <button class="log-save-btn" id="save-${dateStr}">Save</button>
        </div>
      </div>
    `;

    grid.appendChild(card);
    attachCardEvents(card, dateStr);
  });
}

function attachCardEvents(card, dateStr){
  const viewEl  = document.getElementById(`view-${dateStr}`);
  const editEl  = document.getElementById(`edit-${dateStr}`);
  const saveBtn = document.getElementById(`save-${dateStr}`);
  const dot     = document.getElementById(`dot-${dateStr}`);

  function enterEdit(){
    card.classList.add('log-card--editing');
    viewEl.style.display = 'none';
    editEl.style.display = 'block';
    saveBtn.style.display = 'inline-block';
    editEl.focus();
    const len = editEl.value.length;
    editEl.setSelectionRange(len, len);
  }

  function exitEdit(){
    card.classList.remove('log-card--editing');
    viewEl.style.display = 'block';
    editEl.style.display = 'none';
    saveBtn.style.display = 'none';
  }

  viewEl.addEventListener('click', enterEdit);

  editEl.addEventListener('input', () => {
    clearTimeout(saveTimers[dateStr]);
    dot.classList.add('log-saving-dot--active');
    saveTimers[dateStr] = setTimeout(async () => {
      const text = editEl.value;
      updateView(viewEl, text);
      await saveLog(dateStr, text);
      dot.classList.remove('log-saving-dot--active');
    }, 900);
  });

  saveBtn.addEventListener('click', async () => {
    const text = editEl.value;
    dot.classList.add('log-saving-dot--active');
    updateView(viewEl, text);
    await saveLog(dateStr, text);
    dot.classList.remove('log-saving-dot--active');
    exitEdit();
  });

  document.addEventListener('click', (e) => {
    if(!card.contains(e.target) && card.classList.contains('log-card--editing')){
      saveBtn.click();
    }
  });

  editEl.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') saveBtn.click();
  });
}

function updateView(viewEl, text){
  if(text.trim()){
    viewEl.classList.remove('log-view--empty');
    viewEl.textContent = text;
  } else {
    viewEl.classList.add('log-view--empty');
    viewEl.textContent = 'Click to write your thoughts for this day\u2026';
  }
}

function updateMonthLabel(){
  document.getElementById('monthLabel').textContent =
    `${MONTHS[currentMonth]} ${currentYear}`;
}

async function loadMonth(){
  document.getElementById('logsGrid').innerHTML =
    `<div class="logs-empty" style="opacity:.4">Loading\u2026</div>`;
  [logsData, tradesData] = await Promise.all([
    fetchLogs(currentYear, currentMonth),
    fetchTrades(currentYear, currentMonth)
  ]);
  renderCards();
}

document.getElementById('prevMonth').addEventListener('click', () => {
  currentMonth--;
  if(currentMonth < 0){ currentMonth = 11; currentYear--; }
  updateMonthLabel(); loadMonth();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  const now = new Date();
  if(currentYear === now.getFullYear() && currentMonth === now.getMonth()) return;
  currentMonth++;
  if(currentMonth > 11){ currentMonth = 0; currentYear++; }
  updateMonthLabel(); loadMonth();
});

updateMonthLabel();
loadMonth();
</script>

{% endblock %}
