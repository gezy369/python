{% extends "base.html" %}

{% block title %}Charts{% endblock %}

{% block content %}

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<h2>Charts</h2>

<div style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
  <label>Symbol:
    <input type="text" id="symbolInput" value="MNQ" style="width: 80px; text-transform: uppercase;">
  </label>
  <button onclick="loadChart()">Load</button>
  <span id="chartStatus" style="color:#888;font-size:0.85rem;"></span>
</div>

<!-- Chart wrapper -->
<div style="position: relative;">

  <!-- Legend -->
  <div id="chartLegend"
       style="
         position:absolute;
         top:10px;
         left:10px;
         z-index:10;
         background:rgba(255,255,255,0.85);
         padding:6px 10px;
         border-radius:6px;
         font-size:12px;
         font-family:sans-serif;
         color:#333;
         border:1px solid #eee;
         line-height:1.6;
       ">
    <div><span style="color:magenta;font-weight:bold;">●</span> VWAP</div>
    <div><span style="color:#2962FF;font-weight:bold;">●</span> EMA 21</div>
  </div>

  <div id="mainChart" style="height:500px;border:1px solid #ddd;border-radius:6px;"></div>
</div>

<script>
let chartInstance = null;

/* ---------------- VWAP ---------------- */
function calculateVWAP(candles) {
  let cumulativeTPV = 0;
  let cumulativeVolume = 0;
  let currentSession = null;

  return candles.map(c => {
    const session = new Date(c.time * 1000).toISOString().slice(0, 10);

    if (session !== currentSession) {
      currentSession = session;
      cumulativeTPV = 0;
      cumulativeVolume = 0;
    }

    const volume = Number(c.volume ?? 0);
    if (!volume || volume <= 0) return null;

    const tp = (c.high + c.low + c.close) / 3;

    cumulativeTPV += tp * volume;
    cumulativeVolume += volume;

    return {
      time: c.time,
      value: cumulativeTPV / cumulativeVolume
    };
  }).filter(Boolean);
}

/* ---------------- EMA 21 ---------------- */
function calculateEMA(candles, period = 21) {
  const multiplier = 2 / (period + 1);
  let ema = null;

  return candles.map((c, i) => {
    if (i < period - 1) return null;

    if (i === period - 1) {
      const sma =
        candles.slice(0, period)
          .reduce((sum, x) => sum + x.close, 0) / period;

      ema = sma;
    } else {
      ema = (c.close - ema) * multiplier + ema;
    }

    return {
      time: c.time,
      value: ema
    };
  }).filter(Boolean);
}

/* ---------------- MAIN ---------------- */
async function loadChart() {
  const chartEl = document.getElementById("mainChart");
  const status = document.getElementById("chartStatus");

  if (!chartEl) return;

  if (typeof LightweightCharts === "undefined") {
    chartEl.innerHTML = "Chart library failed to load.";
    return;
  }

  status.textContent = "Loading...";
  chartEl.innerHTML = "";

  if (chartInstance) {
    chartInstance.remove();
    chartInstance = null;
  }

  try {
    const symbol = document.getElementById("symbolInput").value.trim().toUpperCase() || "MNQ";

    const res = await fetch(`/api/yahoo/${symbol}?interval=5m&range=1d`);
    const json = await res.json();

    if (!json?.chart?.result?.length) {
      throw new Error("Invalid API response");
    }

    const result = json.chart.result[0];
    const timestamps = result.timestamp || [];
    const quote = result.indicators?.quote?.[0];

    if (!quote) throw new Error("Missing quote data");

    const volume = quote.volume || [];

    const candles = timestamps
      .map((t, i) => ({
        time: t,
        open: quote.open?.[i],
        high: quote.high?.[i],
        low: quote.low?.[i],
        close: quote.close?.[i],
        volume: volume[i] ?? 0,
      }))
      .filter(c =>
        Number.isFinite(c.open) &&
        Number.isFinite(c.high) &&
        Number.isFinite(c.low) &&
        Number.isFinite(c.close)
      );

    if (candles.length < 5) {
      throw new Error("Not enough data");
    }

    chartInstance = LightweightCharts.createChart(chartEl, {
      height: 500,
      layout: {
        background: { color: "#ffffff" },
        textColor: "#333"
      },
      timeScale: {
        timeVisible: true,
        secondsVisible: false,
      },
    });

    const candleSeries = chartInstance.addCandlestickSeries();
    candleSeries.setData(candles);

    const vwapSeries = chartInstance.addLineSeries({
      color: "magenta",
      lineWidth: 2,
      priceLineVisible: false,
      lastValueVisible: false,
    });

    vwapSeries.setData(calculateVWAP(candles));

    const emaSeries = chartInstance.addLineSeries({
      color: "#2962FF",
      lineWidth: 2,
      priceLineVisible: false,
      lastValueVisible: false,
    });

    emaSeries.setData(calculateEMA(candles, 21));

    chartInstance.timeScale().fitContent();

    status.textContent = `${symbol} · 5m · 1D`;

  } catch (err) {
    console.error(err);
    status.textContent = `⚠ ${err.message}`;
    chartEl.innerHTML = `<div style="color:red;padding:10px;">Chart error: ${err.message}</div>`;
  }
}

/* ---------------- INPUT ---------------- */
document.getElementById("symbolInput").addEventListener("input", e => {
  e.target.value = e.target.value.toUpperCase();
});

/* ---------------- INIT ---------------- */
loadChart();
</script>

{% endblock %}
